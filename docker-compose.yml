# ContentPilot local stack.
#
# api, worker, renderer, postgres, minio, plus the Aspire dashboard as an OTLP sink.
name: contentpilot

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=contentpilot;Username=contentpilot;Password=${POSTGRES_PASSWORD:-contentpilot}"
  ObjectStorage__ServiceUrl: "http://minio:9000"
  # What a browser can reach. The host is part of the signature, so a presigned URL has
  # to be signed against this from the start rather than rewritten afterwards.
  ObjectStorage__PublicServiceUrl: "http://localhost:9000"
  ObjectStorage__Bucket: contentpilot
  ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-contentpilot}
  ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-contentpilot-dev-secret}
  ObjectStorage__ForcePathStyle: "true"
  Telemetry__OtlpEndpoint: "http://aspire:18889"
  # RendererClientOptions's bound property is BaseUrl, not BaseAddress — this was silently
  # ignored (unknown config keys don't error) and every render call fell back to the
  # option's http://localhost:8081 default, unreachable inside a container.
  Renderer__BaseUrl: "http://renderer:8080"
  # Read from .env (see .env.example) — compose only substitutes these into the values
  # below, it does not forward arbitrary host environment variables into a container on
  # its own, so without this line here the key never reaches api/worker regardless of what
  # is set in .env.
  Ai__Enabled: "${Ai__Enabled:-false}"
  Ai__Cassettes: "${Ai__Cassettes:-Off}"
  Ai__CampaignBudgetMicroCents: "${Ai__CampaignBudgetMicroCents:-200000000}"
  Ai__Providers__Anthropic__ApiKey: "${Ai__Providers__Anthropic__ApiKey:-}"
  Ai__Providers__OpenAi__ApiKey: "${Ai__Providers__OpenAi__ApiKey:-}"
  Email__Enabled: "${Email__Enabled:-false}"
  Email__Smtp__Host: "${Email__Smtp__Host:-smtp-mail.outlook.com}"
  Email__Smtp__Port: "${Email__Smtp__Port:-587}"
  Email__Smtp__Username: "${Email__Smtp__Username:-}"
  Email__Smtp__Password: "${Email__Smtp__Password:-}"
  Email__ReviewUiBaseUrl: "${Email__ReviewUiBaseUrl:-http://localhost:4200}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contentpilot
      POSTGRES_USER: contentpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentpilot}
    ports:
      # Deliberately not 5432. A locally installed PostgreSQL binds the default port, and
      # both listeners then answer on localhost — connections land on whichever wins, with
      # an authentication failure as the only clue.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentpilot -d contentpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub's minio/minio repo was pulled/restricted; quay.io is MinIO's own current home.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contentpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-contentpilot-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once, then exits. Buckets stay private: no anonymous policy.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-contentpilot} ${MINIO_ROOT_PASSWORD:-contentpilot-dev-secret} &&
      mc mb --ignore-existing local/contentpilot &&
      echo 'bucket ready'
      "

  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "18889:18889"

  # Explicit init step. Migrations never run automatically on app startup: several
  # replicas racing each other through a schema change is how you corrupt one.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/ContentPilot.Worker/ContentPilot.Worker.csproj
        ENTRY: ContentPilot.Worker.dll
    command: ["--migrate"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/ContentPilot.Api/ContentPilot.Api.csproj
        ENTRY: ContentPilot.Api.dll
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/ContentPilot.Worker/ContentPilot.Worker.csproj
        ENTRY: ContentPilot.Worker.dll
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Two replicas prove FOR UPDATE SKIP LOCKED under real contention rather than
    # only in a test.
    deploy:
      replicas: 2

  renderer:
    build:
      context: .
      dockerfile: docker/Dockerfile.renderer
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Rendering is CPU-bound. Let the render queue back up rather than thrash.
      Renderer__MaxConcurrentRenders: "2"
    ports:
      - "8081:8080"
    # Chromium wants more than the default 64 MB of shared memory, and headless crashes
    # from that shortage look like random render timeouts.
    shm_size: 512mb
    deploy:
      resources:
        limits:
          memory: 3g

volumes:
  postgres-data:
  minio-data:
